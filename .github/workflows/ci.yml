name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test Bookify.slnx

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bookify.Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Bookify.Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
